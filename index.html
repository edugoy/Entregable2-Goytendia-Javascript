<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calculador de notas</h1>

    <form id="form-nota">
        <label>Nota (1 a 10):</label>
        <input id="input-nota" type="number" min="1" max="10" required>
        <button>Agregar</button>
    </form>

    <h3>Notas ingresadas</h3>
    <div id="lista"></div>

    <h3>Promedio</h3>
    <p id="promedio"></p>

    <button id="limpiar">Limpiar todo</button>

    <script src="js/main.js"></script>

</body>
</html>
